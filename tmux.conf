# --- Terminal: Ghostty outside, tmux-256color inside -------------------------
# (screen-256color is legacy: no italics/undercurl capabilities)
set -g default-terminal "tmux-256color"

# Declare what the outer terminal (Ghostty) supports
set -as terminal-features ',xterm-ghostty:RGB'         # true color
set -as terminal-features ',xterm-ghostty:usstyle'     # undercurl + colored underlines
set -as terminal-features ',xterm-ghostty:hyperlinks'  # OSC 8 clickable links
set -as terminal-features ',xterm-ghostty:extkeys'     # extended keys (CSI u)
set -as terminal-features ',xterm-ghostty:clipboard'   # OSC 52

# Undercurl fallback for non-ghostty outer terminals (harmless alongside usstyle)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Extended keys end-to-end — fixes Shift+Enter (newline) in Claude Code/Codex TUIs
set -s extended-keys on
set -s extended-keys-format csi-u

set -g allow-passthrough on   # apps may pass OSC 52 / image protocols through
set -g set-clipboard on       # tmux copy -> OSC 52 -> macOS clipboard (no helpers needed)
set -g focus-events on        # Neovim FocusGained/autoread

# Inlined from tmux-sensible (the plugin is dormant and re-sets screen-256color
# + injects the obsolete reattach-to-user-namespace on macOS — dropped)
set -s escape-time 10
set -g history-limit 50000
set -g display-time 4000
setw -g aggressive-resize on
set -g status-keys emacs
bind C-p previous-window
bind C-n next-window

# Reload this config
bind R source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# change window indexing
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# remap prefix from 'C-b' to 'C-f'
unbind C-b
set-option -g prefix C-f
bind-key C-f send-prefix

bind g set-option status
bind h split-window -h -c "#{pane_current_path}"
bind s split-window -c "#{pane_current_path}"
bind k new-window

# Window navigation
bind -n F7 previous-window
bind -n F8 next-window

# Move current window left/right
bind -n C-F7 swap-window -d -t -1
bind -n C-F8 swap-window -d -t +1

bind -r C-k resize-pane -U 2
bind -r C-j resize-pane -D 2
bind -r C-h resize-pane -L 2
bind -r C-l resize-pane -R 2
bind -r C-Enter resize-pane -Z

setw -g mode-keys vi
set -g mouse on
# Toggle mouse support (and scrolling) on/off with prefix + m
bind m set -g mouse \; display "Mouse: #{?mouse,on,off}"
bind -n PageUp copy-mode -eu
bind -n PageDown send-keys PageDown
# Make the scroll wheel page up/down (instead of line-by-line)
bind -n WheelUpPane if -Ft= '#{mouse_any_flag}' 'send -M' 'if -Ft= "#{pane_in_mode}" "send -X page-up" "copy-mode -e ; send -X page-up"'
bind -n WheelDownPane if -Ft= '#{pane_in_mode}' 'send -X page-down' 'send -M'

# Vi-style copy-mode bindings
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-u send-keys -X halfpage-up
bind -T copy-mode-vi C-d send-keys -X halfpage-down

# --- Session switching: sesh + fzf popup on prefix+T -------------------------
set -g detach-on-destroy off  # killing a session switches instead of exiting tmux
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# --- Popups -------------------------------------------------------------------
# lazygit in a popup for the current pane's project
bind G display-popup -E -w 80% -h 80% -d "#{pane_current_path}" lazygit

# Bootstrap tpm on a fresh clone (plugins/ is gitignored; tpm installs the rest)
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
# fzf-grab text/paths/URLs from scrollback (prefix+Tab) — great for agent output
set -g @plugin 'laktak/extrakto'
# Persistent per-project Claude Code popups: prefix+y launch/re-attach,
# prefix+u picker of all Claude sessions with done/working state
set -g @plugin 'craftzdog/tmux-claude-session-manager'

# --- Session persistence ---
# tmux-resurrect saves/restores; tmux-continuum drives the 15-min autosave.
# IMPORTANT: tmux-continuum is declared LAST (further down, after the gruvbox
# theme). Continuum installs autosave by appending to `status-right`, but the
# gruvbox theme overwrites `status-right` wholesale. If continuum loads first,
# the theme wipes out its autosave hook and nothing is ever saved. Loading
# continuum after gruvbox makes it append to the theme's status-right instead.
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Automatically restore the last saved environment when tmux starts
set -g @continuum-restore 'on'
# Save the environment every 15 minutes (default)
set -g @continuum-save-interval '15'
# Restore pane contents (scrollback) along with layout
set -g @resurrect-capture-pane-contents 'on'
# Restore neovim/vim sessions if a session file is present
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-strategy-vim 'session'

set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox-statusbar-alpha 'true'

# tmux-continuum MUST load after gruvbox (see persistence note above) so its
# 15-minute autosave hook is appended to the theme's status-right, not wiped.
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g pane-border-lines 'heavy'
set -g pane-border-indicators 'both'

# Dim inactive panes slightly
set -g window-style 'fg=colour245'
set -g window-active-style 'fg=colour255'

# Disable pane borders' background colors
set -g pane-border-style bg=default
set -g pane-active-border-style bg=default

# Use a transparent background for tmux's default display
set-option -g status-bg default

# Preserve transparency for tmux's status-line
set-option -g status-style bg=default

run '~/.config/tmux/plugins/tpm/tpm'

# vim-tmux-navigator (2026 update) force-binds prefix C-l to "send-keys C-l"
# (clear-screen restore), which would clobber our resize bind. Anything below
# the tpm run line wins over plugin binds — re-assert the resize set here.
bind -r C-h resize-pane -L 2
bind -r C-j resize-pane -D 2
bind -r C-k resize-pane -U 2
bind -r C-l resize-pane -R 2
