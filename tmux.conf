# --- Terminal: Ghostty outside, tmux-256color inside -------------------------
# (screen-256color is legacy: no italics/undercurl capabilities)
set -g default-terminal "tmux-256color"

# Declare what the outer terminal (Ghostty) supports
set -as terminal-features ',xterm-ghostty:RGB'         # true color
set -as terminal-features ',xterm-ghostty:usstyle'     # undercurl + colored underlines
set -as terminal-features ',xterm-ghostty:hyperlinks'  # OSC 8 clickable links
set -as terminal-features ',xterm-ghostty:extkeys'     # extended keys (CSI u)
set -as terminal-features ',xterm-ghostty:clipboard'   # OSC 52

# Undercurl fallback for non-ghostty outer terminals (harmless alongside usstyle)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Extended keys end-to-end — fixes Shift+Enter (newline) in Claude Code/Codex TUIs
set -s extended-keys on
set -s extended-keys-format csi-u

set -g allow-passthrough on   # apps may pass OSC 52 / image protocols through
set -g set-clipboard on       # tmux copy -> OSC 52 -> macOS clipboard (no helpers needed)
set -g focus-events on        # Neovim FocusGained/autoread

# Inlined from tmux-sensible (the plugin is dormant and re-sets screen-256color
# + injects the obsolete reattach-to-user-namespace on macOS — dropped)
set -s escape-time 10
set -g history-limit 50000
set -g display-time 4000
setw -g aggressive-resize on
set -g status-keys emacs
bind C-p previous-window
bind C-n next-window

# Reload this config
bind R source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# change window indexing
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# remap prefix from 'C-b' to 'C-f'
unbind C-b
set-option -g prefix C-f
bind-key C-f send-prefix

bind g set-option status
bind h split-window -h -c "#{pane_current_path}"
bind s split-window -c "#{pane_current_path}"
bind k new-window

# Window navigation
bind -n F7 previous-window
bind -n F8 next-window

# Move current window left/right
bind -n C-F7 swap-window -d -t -1
bind -n C-F8 swap-window -d -t +1

bind -r C-k resize-pane -U 2
bind -r C-j resize-pane -D 2
bind -r C-h resize-pane -L 2
bind -r C-l resize-pane -R 2
bind -r C-Enter resize-pane -Z

setw -g mode-keys vi
set -g mouse on
# Toggle mouse support (and scrolling) on/off with prefix + m
bind m set -g mouse \; display "Mouse: #{?mouse,on,off}"
bind -n PageUp copy-mode -eu
bind -n PageDown send-keys PageDown
# Make the scroll wheel page up/down (instead of line-by-line)
bind -n WheelUpPane if -Ft= '#{mouse_any_flag}' 'send -M' 'if -Ft= "#{pane_in_mode}" "send -X page-up" "copy-mode -e ; send -X page-up"'
bind -n WheelDownPane if -Ft= '#{pane_in_mode}' 'send -X page-down' 'send -M'

# Vi-style copy-mode bindings
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-u send-keys -X halfpage-up
bind -T copy-mode-vi C-d send-keys -X halfpage-down

# --- Session switching: sesh + fzf popup on prefix+T -------------------------
set -g detach-on-destroy off  # killing a session switches instead of exiting tmux
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# --- Popups -------------------------------------------------------------------
# lazygit in a popup for the current pane's project
bind G display-popup -E -w 80% -h 80% -d "#{pane_current_path}" lazygit

# Bootstrap tpm on a fresh clone (plugins/ is gitignored; tpm installs the rest)
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
# fzf-grab text/paths/URLs from scrollback (prefix+Tab) — great for agent output
set -g @plugin 'laktak/extrakto'
# Persistent per-project Claude Code popups: prefix+y launch/re-attach,
# prefix+u picker of all Claude sessions with done/working state
set -g @plugin 'craftzdog/tmux-claude-session-manager'

# --- Session persistence ---
# tmux-resurrect saves/restores; tmux-continuum drives the 15-min autosave.
# Continuum installs that autosave by appending a #() to `status-right`, so any
# later wholesale `set -g status-right` throws it away and nothing is ever
# saved. That is why the status-right at the bottom of this file carries the
# continuum script by hand rather than just being set.
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Automatically restore the last saved environment when tmux starts
set -g @continuum-restore 'on'
# Save the environment every 15 minutes (default)
set -g @continuum-save-interval '15'
# Restore pane contents (scrollback) along with layout
set -g @resurrect-capture-pane-contents 'on'
# Restore neovim/vim sessions if a session file is present
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-strategy-vim 'session'

set -g @plugin 'tmux-plugins/tmux-continuum'

set -g pane-border-lines 'heavy'
set -g pane-border-indicators 'both'

# Dim inactive panes slightly
set -g window-style 'fg=colour245'
set -g window-active-style 'fg=colour255'

# Use a transparent background for tmux's default display
set-option -g status-bg default

# Preserve transparency for tmux's status-line
set-option -g status-style bg=default

run '~/.config/tmux/plugins/tpm/tpm'

# vim-tmux-navigator (2026 update) force-binds prefix C-l to "send-keys C-l"
# (clear-screen restore), which would clobber our resize bind. Anything below
# the tpm run line wins over plugin binds — re-assert the resize set here.
bind -r C-h resize-pane -L 2
bind -r C-j resize-pane -D 2
bind -r C-k resize-pane -U 2
bind -r C-l resize-pane -R 2

# --- Colours ------------------------------------------------------------------
# Everything tmux-gruvbox still contributed once the status line below replaced
# its formats, inlined at the values it was setting, so the look is unchanged
# and the plugin is gone. The numbers are the gruvbox 256 palette by origin:
# 223 foreground, 237/239/248/250 greys, 109 blue, 167 red.
#
# The two lengths matter more than they look. tmux's own defaults are 10 and 40
# characters; status-right carries continuum's #() plus one entry per waiting
# agent, so without this it truncates silently as the fleet grows.
set -g status-left-length 80
set -g status-right-length 80

# Stock message styling is yellow-on-black — the loudest thing on a flat bar.
set -g message-style         "bg=colour239,fg=colour223"
set -g message-command-style "bg=colour248,fg=colour237"

# Stock activity/bell is `reverse`, which inverts the whole tab rather than
# tinting it.
set -g window-status-activity-style "bg=colour237,fg=colour248"
set -g window-status-bell-style     "bg=colour167,fg=colour235"

# bg=default keeps the terminal's own background showing through the borders;
# the fg is what the theme used to supply. One line each, because the theme
# replaced this option wholesale — the old bare `bg=default` pair never
# survived plugin load, and only starts taking effect now.
set -g pane-border-style        "bg=default,fg=colour237"
set -g pane-active-border-style "bg=default,fg=colour250"

set -g clock-mode-colour           colour109  # prefix+t
set -g display-panes-colour        colour237  # prefix+q
set -g display-panes-active-colour colour250

# Not inherited from anywhere: copy-mode's selection is tmux's stock
# yellow-on-black. The theme never set mode-style, so this is what you have
# always had — left alone here rather than quietly restyled.

# --- Agent state on the window tab --------------------------------------------
# tmux-agent (~/tools/tmux-agent) puts each Claude/Codex session's state on the
# window hosting it, and names unnamed windows after what the session is about.
# Hooks push the state; nothing polls. `tmux-agent doctor` explains itself.
#
#   blue  = working, ignore it     green = turn finished, your move
#   red   = blocked on you (permission prompt, or idle too long)
#
# Options must be set BEFORE the plugin loads — it bakes them into the format
# strings once, rather than re-reading options on every status redraw. The
# active tab has no fill of its own now, so it uses the same bright palette as
# the rest (the plugin's -current defaults follow the base colours).
#
# Guarded: without the tool everything below still works, the glyph slot just
# stays empty.
if "test -f ~/tools/tmux-agent/tmux-agent.tmux" \
   "run '~/tools/tmux-agent/tmux-agent.tmux'"

# --- Flat status line ---------------------------------------------------------
# No background fills anywhere. The active window is marked by weight and
# brightness, not by a coloured block, which leaves the agent glyphs as the only
# colour on the bar — so state is what the eye lands on.
#
# The glyph's shape is the engine (✻ Claude, ⬢ Codex) and its colour is the
# state. Empty when there is no agent, and the space around it is fixed either
# way, so nothing shifts as sessions come and go.
# The active window is marked by a thin accent rule underneath. Underline is a
# channel nothing else on the bar uses, so it never competes with the agent
# glyphs, and it needs no fill and no extra width — the tabs do not shift as you
# move between them. us= (a separate underline colour) needs the terminal to
# advertise usstyle, which the terminal-features lines at the top set up.
# Swap underscore for curly-, double-, dotted- or dashed-underscore to taste.
# No window numbers — prefix+<n> still selects them, and renumber-windows keeps
# the indices sequential, so the digits were only ever noise on the bar.
#
# The glyph slot falls back to a space rather than collapsing, so a window with
# no agent stays the same width as one that has it and the tabs keep a common
# left edge.
set -g window-status-separator "   "
set -g window-status-format         "#[fg=colour245]#{?#{@agent_state},#{E:@agent_dot}, } #{?#{@wcolour},#[fg=#{@wcolour}],}#W"
set -g window-status-current-format "#[fg=colour223,us=colour214,underscore]#{?#{@agent_state},#{E:@agent_dot_current}, } #{?#{@wcolour},#[fg=#{@wcolour}],}#W#{?window_zoomed_flag, Z,}"

# --- Manual colour tag on a window --------------------------------------------
# prefix+_ walks the cycle forward, prefix+[ back:
#
#   auto -> gray -> white -> blue -> green -> red -> auto
#
# It colours the window NAME. The agent glyph keeps its own colour, so the two
# channels stay independent: the glyph is what the agent is doing and is set for
# you, the name is what you decided the window is and is set by hand. "auto" is
# the empty tag, which falls back to the colours above.
#
# The #[fg=] here holds a format rather than a literal colour — tmux expands the
# whole string before parsing styles, and setting only fg leaves the active
# tab's underline intact.
#
# NOTE: this takes prefix+[ away from copy-mode. PageUp and the scroll wheel
# still enter it (see the mouse section above).
bind -r "_" run-shell "~/.config/tmux/scripts/window-colour.sh next"
bind -r "[" run-shell "~/.config/tmux/scripts/window-colour.sh prev"

# Session name, then a hairline before the tabs start.
set -g status-left "#[fg=colour246]#S #[fg=colour239]│ "
set -g status-style "bg=default,fg=colour245"

# Breathing room above the bar. tmux has no padding option for the status line,
# so this claims a second status row and leaves the upper one empty — it renders
# as a blank, transparent line between the panes and the bar.
#
# The real bar has to move down to row 1, which means carrying tmux's own status
# template across (1.5KB of alignment and mouse-range logic worth not rewriting).
# Guarded, so re-sourcing does not copy the blanked row over the good one.
run 'case "$(tmux show -gv "status-format[1]")" in *status-left*) ;; *) tmux set -g "status-format[1]" "$(tmux show -gv "status-format[0]")" ;; esac'
set -g status-format[0] ""
set -g status 2

# The right side carries agent state and nothing else.
#
# The #() is tmux-continuum's autosave: it is a plugin implementation detail,
# but living in status-right IS its 15-minute timer (see the persistence note
# above), so it has to be carried over by hand once the theme's value is gone.
# Drop it and nothing is ever saved.
set -g status-right "#(~/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#[bg=default,fg=default]#{E:@agent_fleet}"

# prefix+a walks the queue of agents that want you (bound by the plugin).
